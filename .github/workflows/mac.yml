name: mac

on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/mac.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/mac.yml'

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: bash scripts/build-app.sh
      - run: build/ClaudeToolbar.app/Contents/MacOS/ClaudeToolbar --version
      - run: build/ClaudeToolbar.app/Contents/MacOS/ClaudeToolbar --snapshot build/snapshots
      - run: ls -la build/snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: mac-snapshots
          path: mac/build/snapshots
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeToolbar-mac
          path: mac/build/ClaudeToolbar-mac.zip
          if-no-files-found: error
