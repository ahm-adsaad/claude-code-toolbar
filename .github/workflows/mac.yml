name: mac

on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/mac.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/mac.yml'

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release
      - run: swift test
